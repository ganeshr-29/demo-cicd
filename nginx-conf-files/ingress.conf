server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    #   access_log /var/log/nginx/access.log json_combined;

      # --- REAL IP MODULE CONFIGURATION ---
      # These lines tell NGINX to look past the AWS Load Balancer
    #   set_real_ip_from  192.168.0.0/16; 
    #   set_real_ip_from  10.0.0.0/8;      
    #   real_ip_header    X-Forwarded-For;
    #   real_ip_recursive on;

      #limit_req_status 429;
      #limit_req zone=global_limit burst=10 nodelay;

    location / {
        # limit_req_status 429;
        # limit_req zone=homepage_limit burst=10 nodelay;
        proxy_pass http://login:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/ {
        proxy_pass http://login:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /signup/ {
        proxy_pass http://signup:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /success/ {
        proxy_pass http://success:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

    