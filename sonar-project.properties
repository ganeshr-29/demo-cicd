# Character encoding
sonar.sourceEncoding=UTF-8

# Project identification
sonar.projectKey=demo-proj
sonar.projectName=demo-proj

# Scan the source folder
sonar.sources=.
sonar.exclusions=**/.git/**,**/.pytest_cache/**,**/.scannerwork/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/*.pyc,test/**,coverage.xml,test-results.xml,.coverage,hadolint-report.json,init.sql,Jenkinsfile,compose.yaml

# Language configurations
sonar.python.version=3
sonar.html.file.suffixes=.html
sonar.css.file.suffixes=.css
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.docker.file.suffixes=.Dockerfile
sonar.docker.file.patterns=*Dockerfile*,Dockerfile*

# Coverage and Test Execution Reports
sonar.tests=test
# sonar.test.inclusions=test/**/test_*.py,test/**/*_test.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPaths=test-results.xml
sonar.externalIssuesReportPaths=hadolint-report.json

