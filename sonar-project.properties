# Project identification
sonar.projectKey=demo-proj
sonar.projectName=demo-proj

# Scan the root directory so .env and other root configs are reachable
sonar.sources=.

# Specify what files and folders SonarQube should index
sonar.inclusions=Application-Source-Code/**,dockerfiles/**,.env

# Exclusions to prevent performance lag
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.min.js,**/__pycache__/**,**/*.pyc,**/.git/**

# Secrets & Text sensor configuration (tells SonarQube to treat .env as text/secret-scannable)
sonar.text.inclusions=**/*.env*,.env,**/*.txt,**/*.md

# Language configurations
sonar.python.version=3
sonar.html.file.suffixes=.html
sonar.css.file.suffixes=.css

# JavaScript & React extensions
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Docker configurations
sonar.docker.file.suffixes=.Dockerfile
sonar.docker.file.patterns=*Dockerfile*,Dockerfile*

# Character encoding
sonar.sourceEncoding=UTF-8

# Hadolint external issues report
sonar.externalIssuesReportPaths=hadolint-report.json