# Project identification
sonar.projectKey=demo-proj
sonar.projectName=demo-proj

# Scan root workspace to include source folders and root config files
sonar.sources=.

# Files and directories to include in the scan
sonar.inclusions=Application-Source-Code/**,dockerfiles/**,*.env,**/*.env,**/*.sql,**/*.conf

# Exclude dependencies, cache, git metadata, and report artifacts
sonar.exclusions=**/.git/**,**/node_modules/**,**/build/**,**/dist/**,**/*.min.js,**/__pycache__/**,**/*.pyc,hadolint-report.json

# Enable Text & Secrets sensor for config/env/sql files
sonar.text.inclusions=**/*.env*,.env,**/*.sql,**/*.conf,**/*.txt

# Language configurations
sonar.python.version=3
sonar.html.file.suffixes=.html
sonar.css.file.suffixes=.css
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Docker configurations
sonar.docker.file.suffixes=.Dockerfile
sonar.docker.file.patterns=*Dockerfile*,Dockerfile*

# Character encoding
sonar.sourceEncoding=UTF-8

# Hadolint external issues report
sonar.externalIssuesReportPaths=hadolint-report.json